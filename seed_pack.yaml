      - "the office is on the third floor"
      - "it's in the building next to the bank"
      - "I'm in Tokyo for the week"
      - "the team is based in Berlin"
      - "the venue is somewhere in the Mission district"
      - "we're flying into Heathrow"
      - "the keys are on the kitchen counter"
      - "the file is in the top drawer"
