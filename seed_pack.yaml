      - "any minute now"
      - "all the children laughed"
      - "both options look fine"
      - "many years had passed"
      - "few people noticed"
      - "the storm came suddenly"
      - "an old friend called"
      - "this house feels warm"
    members:
      - { element_id: VOID_DET_THE,   names: ["the"] }
      - { element_id: VOID_DET_A,     names: ["a"] }
      - { element_id: VOID_DET_AN,    names: ["an"] }
      - { element_id: VOID_DET_THIS,  names: ["this"] }
      - { element_id: VOID_DET_THAT,  names: ["that"] }
      - { element_id: VOID_DET_THESE, names: ["these"] }
      - { element_id: VOID_DET_THOSE, names: ["those"] }
      - { element_id: VOID_DET_EVERY, names: ["every"] }
      - { element_id: VOID_DET_SOME,  names: ["some"] }
      - { element_id: VOID_DET_ANY,   names: ["any"] }
      - { element_id: VOID_DET_NO,    names: ["no"] }
      - { element_id: VOID_DET_ALL,   names: ["all"] }
      - { element_id: VOID_DET_BOTH,  names: ["both"] }
      - { element_id: VOID_DET_MANY,  names: ["many"] }
      - { element_id: VOID_DET_FEW,   names: ["few"] }
      - { element_id: VOID_DET_EACH,  names: ["each"] }
    rationale: >
      Determiners scope noun phrases in nearly every English clause;
      filtering them as void preserves the "the cat sat on the mat" →
      ["cat", "mat"] content-token residue. UD `DET`.

