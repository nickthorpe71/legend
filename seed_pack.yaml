      - "for the chemistry project specifically"
      - "in our marketing context"
      - "for the auth service"
      - "within the mobile team's scope"
      - "for project Helios"
    rationale: >
      Domain markers scope subsequent relations via
      `[target: R, frame: F]` meta-relations; a region for them lets
      the frame-extraction heuristic find them reliably.

  - element_id: REGION_MODAL_NEGATED
    names: ["modal_negated", "modality_or_negation"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "Inputs that carry modality (might / must / should) or
                 negation, or that express uncertainty about content."
    examples:
      - "she might come to the meeting"
      - "this could be a database issue"
      - "we may need to revisit the design"
      - "it would be better with two examples"
      - "you should probably double-check"
      - "I'm not sure about the timeline"
      - "maybe she changed her mind"
      - "it's probably fine"
      - "I think the deploy worked"
      - "perhaps we missed something"
      - "we don't have a clear answer yet"
      - "it's not what I expected"
      - "she didn't get the message"
      - "we never finalized the design"
      - "there's no record of it"
      - "I doubt that will work"
      - "I'm skeptical about the new policy"
      - "I'm not entirely convinced"
      - "she might not come"
      - "we shouldn't proceed without legal sign-off"
    rationale: >
      Modality and negation are first-class via the five behavioral
      modal attribute names (`negated` / `uncertain` / `non_actual` /
      `general` / `intervened`) on meta-relations; a region for
      modality-heavy inputs ensures those meta-relations get
      populated rather than dropped.

  # ── Polarity = Void subtree ─────────────────────────────────────────
  # Closed-class grammatical regions, sat under the VOID anchor. Every
  # element minted under these regions inherits polarity=Void: routing
  # uses the same cosine machinery as signal regions, but the matched
  # token is *dropped* from downstream extraction rather than propagated.
  # Categories follow the Universal Dependencies POS tagset.

  - element_id: REGION_DETERMINERS
    names: ["determiners"]
    parent_regions: [[VOID, 1.0]]
    descriptor: "Articles, demonstratives, and quantifiers — closed-class
                 words that scope a noun phrase (UD `DET`)."
    examples:
      - "the cat sat on the mat"
      - "an interesting idea came up"
