      - "let's meet in the conference room"
    rationale: >
      Locations have entity-like surface form but distinct semantic
      role; separating them avoids contaminating entity coreference.

  - element_id: REGION_TASKS
    names: ["tasks"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "Work that is intended, active, blocked, completed,
                 deferred, or superseded — todos, plans, in-progress
                 activities."
    examples:
      - "I need to finish the report by Friday"
      - "we should ship the feature next week"
      - "I'm planning to call the dentist tomorrow"
      - "she has to renew her passport soon"
      - "I'm working on the proposal right now"
      - "she's drafting the contract"
      - "the team is debugging the deploy issue"
      - "pick up the dry cleaning"
      - "don't forget to email Sarah back"
      - "remember to book the flight"
      - "I finished the deck this morning"
      - "she submitted the application yesterday"
      - "we wrapped up the migration last week"
      - "the launch is blocked on legal review"
      - "we put the redesign on hold"
      - "I keep pushing this off"
      - "my list for tomorrow: groceries, gym, call mom"
      - "the agenda has three items"
      - "there are five things I still need to do"
      - "let's break this into smaller tasks"
    rationale: >
      Task-shaped inputs route here so trigger lemmas (do, must, will)
      can cluster coherently across ticks.

  - element_id: REGION_DECISIONS
    names: ["decisions"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "An option was selected from alternatives, with
                 rationale or criteria."
    examples:
      - "we decided to go with the Postgres migration over MongoDB"
      - "she chose Stanford over MIT"
      - "they went with the cheaper option in the end"
      - "I picked the chicken instead of the fish"
      - "we're hiring Maria because her timezone overlaps with the team"
      - "I'm taking the train; it's faster door-to-door"
      - "they cancelled the project due to budget cuts"
      - "she rejected the offer because it lacked equity"
      - "I decided to take the job offer"
      - "she's settling on the blue dress"
      - "we landed on the new logo design"
      - "the committee approved the proposal"
      - "the board voted to delay the launch"
      - "we agreed to push the deadline"
      - "we're pivoting to enterprise customers"
      - "they decided to open a second office in Austin"
      - "the team chose Rust for the rewrite"
      - "I'm going with vanilla today"
      - "she opted for the early retirement package"
      - "he decided against the surgery"
    rationale: >
      Decisions have a recurring slot shape (chosen / alternatives /
      rationale) distinct from generic state changes; a dedicated region
      preserves that signal.

  - element_id: REGION_PREFERENCES
    names: ["preferences"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "A stated rule about how user/project behavior should
                 proceed — style preferences, conventions, do/don't
                 directives."
    examples:
      - "always use TypeScript over plain JavaScript"
      - "prefer functional components over class components"
      - "use 2-space indentation, not tabs"
      - "snake_case for filenames, camelCase for variables"
      - "I prefer terse responses without preamble"
      - "send updates in Slack, not email"
      - "ping me on the chat thread, don't DM"
      - "summaries first, details on request"
      - "don't commit without running the test suite"
      - "never force push to main"
      - "always pair on production deploys"
      - "open a PR for any change over 50 lines"
      - "we use Vitest for unit tests, not Jest"
      - "all PRs need at least one approval"
      - "database migrations require a rollback plan"
      - "document every public API change"
      - "I always take meetings in the morning if possible"
      - "I don't drink coffee after 2pm"
      - "I work best with at least 90 minutes of focus time"
      - "I prefer async over real-time when possible"
    rationale: >
      Preferences are persistent, valid-time-open relations that need
      a stable region so they survive decay differently from one-off
      events.

  - element_id: REGION_DEFINITIONS
    names: ["definitions"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "Explicit definitions, glosses, 'X is defined as Y'
                 forms, schema-establishing inputs."
    examples:
      - "a quaternion is an extension of complex numbers to four dimensions"
      - "RAG stands for retrieval-augmented generation"
      - "an embedding is a dense vector representation of input"
      - "ACID means atomicity, consistency, isolation, durability"
      - "spherical k-means is k-means run on the unit sphere"
      - "a hypergraph is a graph where edges can connect more than two nodes"
      - "cosine similarity measures the angle between two vectors"
      - "a deadlock occurs when two processes wait on each other indefinitely"
      - "a User has a name, email, and password hash"
      - "the API response contains status, data, and error fields"
      - "each Element has an ID, name, and embedding"
      - "LLM stands for large language model"
      - "CRDT is short for conflict-free replicated data type"
      - "PR is short for pull request"
      - "we define a prime as a number divisible only by 1 and itself"
      - "let X be a finite set of integers"
      - 'by "consensus" we mean unanimous agreement among participants'
      - "in topology, an open set is one that doesn't contain its boundary"
      - "in finance, EBITDA refers to earnings before interest, taxes, depreciation, and amortization"
      - "in our system, a tick is one execution of the read-mutate pipeline"
    rationale: >
      Definitions seed concept-hierarchy edges (`subclass_of`)
      directly; isolating them from incidental state assertions lets
      replay treat them with higher confidence.

  - element_id: REGION_PROVENANCE
    names: ["provenance"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "An assertion accompanied by an external source pointer
                 — URL, file path, message id, citation."
    examples:
      - "see https://arxiv.org/abs/2310.04567 for the details"
      - "the methodology is described at example.com/methods"
      - "as documented in the wiki article on flow control"
      - "per the GitHub issue at github.com/org/repo/issues/42"
      - "see /docs/architecture.md for the full design"
      - "the spec is in shared/design/v2.pdf"
      - "documented in the codebase at src/router/index.ts"
      - "that's covered in the onboarding handbook page 12"
      - "Alice mentioned that the deploy was rolled back"
      - "Bob said the database is fine now"
      - "according to Maya, the launch is delayed"
      - "the PM told me the timeline shifted"
      - "per the Slack thread in #engineering"
      - "as discussed in yesterday's standup"
      - "the email from finance confirmed the budget"
      - "per the message from Carlos on Friday"
      - "according to the latest quarterly report"
      - "as the spec states in section 4.2"
      - "per the Anthropic paper on constitutional AI"
      - "tracked in JIRA-1234"
    rationale: >
      Provenance-bearing inputs route here so §11.7 reliably attaches
      `[target: R, source: S]` meta-relations and §14.5 can weight them
      differently.

  - element_id: REGION_DOMAINS
    names: ["domains"]
    parent_regions: [[GENESIS, 1.0]]
    descriptor: "Markers that establish or shift the topical domain of
                 surrounding inputs — 'in dental:', 'for project X'."
    examples:
      - "in dental:"
      - "for project Atlas:"
      - "context: medical billing"
      - "switching to security"
      - "mobile team specifically:"
