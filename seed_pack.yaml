    # Low pole = incidental, low-stakes, low-urgency framing.
    low_pole:
      - "by the way"
      - "as a side note"
      - "incidentally"
      - "no rush"
      - "just noting"
      - "not a big deal"
      - "whenever you have time"
      - "no pressure"
      - "minor thing"
      - "small note"
      - "trivial"
      - "at your leisure"
      - "no hurry"
