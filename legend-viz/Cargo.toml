[package]
name = "legend-viz"
version = "0.1.0"
edition = "2021"

[dependencies]
legend = { path = "..", features = ["instrument"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
