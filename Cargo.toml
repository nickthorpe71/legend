[package]
name = "legend"
version = "0.0.0"
edition = "2024"
authors = ["Nick Thorpe <nickthorpe71@gmail.com>"]
description = "Long-term memory for LLMs."
license = "MIT"
repository = "https://github.com/nickthorpe71/legend"
readme = "README.md"
rust-version = "1.89"

[lib]
name = "legend"
path = "src/lib.rs"

[features]
default = []
# Bundles the fp32 model weights (~86 MB) alongside the INT8 weights
# and enables the `inference::bert::forward` fp32 reference path.
# Used by `examples/validate_int8.rs` to compare INT8 output to fp32
# reference. Production builds leave this off — INT8 is the runtime
# path and the binary stays small.
fp32_reference = []
# Bundles GLiNER2 (DeBERTa-v3-small + GLiNER head) fp32 weights
# (~582 MB) and enables `inference::deberta`. Used during Phase 3+
# of the GLiNER2 build-out for layer-by-layer validation against the
# PyTorch oracle. Disabled by default; production path lands as INT8
# in Phase 6.
gliner2_fp32 = []

[[bin]]
name = "legend"
path = "src/main.rs"

[dependencies]
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Pure-Rust SIMD-accelerated matrix multiply. No C deps, no BLAS.
# Within 2× of OpenBLAS on small matrices, which is our regime
# (384×384 attention + 384×1536 FFN).
matrixmultiply = "0.3"
# Word-level splitter for GLiNER preprocessing — matches Python `re`'s
# `\w+(?:[-_]\w+)*|\S` semantics for Unicode word chars.
regex = "1"

[dev-dependencies]
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# tract-onnx is build-time-only: it's used by
# `examples/extract_weights.rs` to read the ONNX file once and dump
# fp32 weights into `models/minilm-fp32.bin`. The runtime library
# does its own pure-Rust BERT forward pass (see `src/inference/`)
# and carries no tract dependency.
tract-onnx = "0.21"

[[bench]]
name = "embed"
harness = false

# Examples that require feature flags. Declared here so `cargo build`
# / `cargo test` skip them automatically when the feature is off.
[[example]]
name = "validate_int8"
required-features = ["fp32_reference"]

[[example]]
name = "bench_gliner2"
required-features = ["gliner2_fp32"]

[[example]]
name = "bench_gliner2_int8"
required-features = ["gliner2_fp32"]

[[example]]
name = "quantize_gliner2_to_int8"
required-features = ["gliner2_fp32"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
