[package]
name = "legend"
version = "0.0.0"
edition = "2024"
authors = ["Nick Thorpe <nickthorpe71@gmail.com>"]
description = "Long-term memory for LLMs."
license = "MIT"
repository = "https://github.com/nickthorpe71/legend"
readme = "README.md"
rust-version = "1.89"

[lib]
name = "legend"
path = "src/lib.rs"

[features]
default = []
# Bundles the fp32 model weights (~86 MB) alongside the INT8 weights
# and enables the `inference::bert::forward` fp32 reference path.
# Used by `examples/validate_int8.rs` to compare INT8 output to fp32
# reference. Production builds leave this off — INT8 is the runtime
# path and the binary stays small.
fp32_reference = []
# Bundles GLiNER2 (DeBERTa-v3-small + GLiNER head) fp32 weights
# (~582 MB) and enables `inference::deberta`. Used during Phase 3+
# of the GLiNER2 build-out for layer-by-layer validation against the
# PyTorch oracle. Disabled by default; production path lands as INT8
# in Phase 6.
gliner2_fp32 = []

[[bin]]
name = "legend"
path = "src/main.rs"

[dependencies]
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Pure-Rust SIMD-accelerated matrix multiply. No C deps, no BLAS.
# Within 2× of OpenBLAS on small matrices, which is our regime
# (384×384 attention + 384×1536 FFN).
matrixmultiply = "0.3"
# Word-level splitter for GLiNER preprocessing — matches Python `re`'s
# `\w+(?:[-_]\w+)*|\S` semantics for Unicode word chars. Also drives
# the temporal-span regex in `steps::temporal`. A future
# `chrono`/`chrono-english` upgrade would turn the matched spans into
# concrete datetimes, but Step 5 only needs the span discovery for v0.
regex = "1"
# Memory-mapped INT8 weight loading. Skips the explicit 150 MB
# Vec<u8> + memcpy that `fs::read` would do; the OS demand-faults
# pages as the parser walks them.
memmap2 = "0.9"
# Binary serde for the pre-parsed GLiNER tokenizer. MessagePack
# instead of bincode 1.x because Tokenizer's internal serializer
# emits unbounded sequences that bincode rejects. Skipping the
# 8MB tokenizer.json JSON parse on every cold start. Also used by
# `src/persistence.rs` to encode the Hypergraph snapshot.
rmp-serde = "1"
# Derives for `Hypergraph` and every type reachable from it, so the
# substrate can survive process restarts via `src/persistence.rs`.
serde = { version = "1", features = ["derive"] }
# Pure-Rust LZ4 (no C deps). Compresses the rmp-serde snapshot — the
# bulk is element embeddings (Vec<f32> × 384 each), which LZ4 packs
# down by ~30-40%.
lz4_flex = "0.11"
# Cross-platform exclusive file locking for the daemon's single-writer
# guarantee. Uniform `lock_exclusive` / `unlock` on top of fcntl on Unix
# and LockFileEx on Windows. No C deps.
fs2 = "0.4"

[dev-dependencies]
criterion = "0.5"
serde_yaml = "0.9"
# JSON reader for external benchmark datasets that ship as JSON.
# All Legend-internal serialization stays on rmp-serde (MessagePack);
# this dep is dev-only and never reachable from the runtime crate.
serde_json = "1"
# Apache Parquet reader for the MemoryAgentBench dataset, which ships
# as parquet on Hugging Face. Dev-only — the harness in
# `examples/bench_memoryagentbench_fc.rs` reads the file once at the
# start of a run and never touches it at runtime.
parquet = "58.3.0"
# Pure-Rust ML framework for running the small instruct LLM that
# verbalizes Legend's focused frame into a natural-language answer.
# CPU-only — no CUDA / Metal features pulled in. Dev-only because the
# verbalizer is currently only used by the bench harness; if a CLI-
# facing verbalize path lands later, promote to regular deps.
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
# anyhow is dev-only, used by the verbalizer smoke test and bench
# wiring for ergonomic error contexts when a model load / forward
# pass / tokenizer call fails. The runtime crate stays on std-only
# error types.
anyhow = "1"
# Note: model weights are fetched via `curl` rather than a Rust HF
# client. Both hf-hub 0.3.x and 1.0.0-rc fail on HF's relative-URL
# redirect behavior (returns `location: /api/resolve-cache/...` on
# the 307; the libs don't resolve it against the request host).
# curl handles relative redirects correctly out of the box.
# tract-onnx is build-time-only: it's used by
# `examples/extract_weights.rs` to read the ONNX file once and dump
# fp32 weights into `models/minilm-fp32.bin`. The runtime library
# does its own pure-Rust BERT forward pass (see `src/inference/`)
# and carries no tract dependency.
tract-onnx = "0.21"

[[bench]]
name = "embed"
harness = false

# Examples that require feature flags. Declared here so `cargo build`
# / `cargo test` skip them automatically when the feature is off.
[[example]]
name = "validate_int8"
required-features = ["fp32_reference"]

[[example]]
name = "bench_gliner2"
required-features = ["gliner2_fp32"]

# These only need the always-on INT8 path — no feature gate required.
# `quantize_gliner2_to_int8` reads the fp32 file on disk but doesn't
# touch the fp32 Rust modules, so it stays feature-free too.

[[example]]
name = "bench_gliner2_int8"

[[example]]
name = "quantize_gliner2_to_int8"

[[example]]
name = "bench_step5_sweep"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

# The inference engine (INT8 matmuls, attention kernels, BiLSTM
# gates) is in this crate, so `[profile.dev.package."*"]` doesn't
# reach it. Without opt-3 the dev-build forward pass is ~30× slower
# than release (~9 s vs ~350 ms on the dentist fixture, and opt-2
# isn't enough — the matmul kernels need full inlining/auto-vec
# to vectorize). Cold rebuilds get a bit longer but incremental
# edits to a single module stay fast, so `cargo run` / `cargo test`
# match release runtime once the crate is compiled.
[profile.dev.package.legend]
opt-level = 3
