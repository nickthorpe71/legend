[workspace]
members = [".", "legend-viz"]
exclude = ["dashboard"]

[package]
name = "legend"
version = "0.4.0"
edition = "2021"
authors = ["Nick Thorpe"]
description = "Lightweight context memory layer for AI-assisted development"
license = "MIT"
repository = "https://github.com/nickthorpe71/legend"
keywords = ["ai", "development", "context", "claude"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "legend"
path = "src/main.rs"


[lib]
name = "legend"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
lz4 = "1.24"
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
rmp-serde = "1.3"
tract-onnx = "0.22"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
interprocess = "2.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
insta = { version = "1.43", features = ["json"] }
predicates = "3.1"
tempfile = "3.18"
# criterion = "0.5"  # Will add for benchmarking in Layer 4-5

# [[bench]]
# name = "performance"
# harness = false

[features]
default = []
instrument = []

[profile.release]
strip = true
lto = "thin"

# Optimize dependencies (notably tract-onnx) in dev/test builds.
# Our own crate stays at opt-level=0 for fast rebuilds and debuggability;
# deps compile once at opt-3 and then run at release speed during tests.
[profile.dev.package."*"]
opt-level = 3
